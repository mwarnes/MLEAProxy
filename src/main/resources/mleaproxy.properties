# ================================================================
# MLEAProxy Default Configuration
# ================================================================
# Property sources (lowest to highest priority):
# 1. This file (classpath:mleaproxy.properties)
# 2. /etc/mleaproxy.properties
# 3. ${HOME}/mleaproxy.properties  
# 4. ./mleaproxy.properties
# 5. Command line args (--mleaproxy.property=value)
# ================================================================

# --- Global Settings ---
mleaproxy.ldap-debug=false
mleaproxy.saml-debug=false
mleaproxy.ssl-verify-certificates=false
mleaproxy.saml-response-validity=300

# --- OAuth Settings ---
# External base URL advertised for the token, JWKS and discovery endpoints.
# MarkLogic 12.1 requires the token and JWKS URIs to be HTTPS, so when the HTTPS
# listener below is enabled its URL is advertised by default. Set this only to
# override that, for example to advertise plain HTTP for a Resource Server setup.
# Default: https://<hostname>:<mleaproxy.https.port>, or http://<hostname>:<server.port>
#          when the HTTPS listener is disabled.
# oauth.server.base.url=https://rocky.warnesnet.com:8443
oauth.jwt.issuer=mleaproxy-oauth-server

# --- HTTPS Listener (OAuth Authorization Code flow) ---
# The Authorization Code flow redirects a browser to MLEAProxy's login page, which must
# be served over HTTPS. This is an ADDITIONAL listener: the primary HTTP port above is
# unchanged, so the Resource Server flow keeps working over http://<host>:8080.
mleaproxy.https.enabled=true
mleaproxy.https.port=8443
mleaproxy.https.address=0.0.0.0
# TLS material. If any of these four files is missing, MLEAProxy generates a private CA
# plus a server certificate signed by it on startup.
# Import ca-certificate.pem into the MarkLogic Certificate Authorities store: MarkLogic
# fetches JWKS and exchanges the authorization code over HTTPS and will reject an
# untrusted certificate.
# Note: the SAML signing certificate in static/certificates cannot be reused here - it has
# no subjectAltName extension and would be rejected by browsers and MarkLogic.
mleaproxy.https.certificate=./certificates/tls-certificate.pem
mleaproxy.https.private-key=./certificates/tls-privkey.pem
mleaproxy.https.ca-certificate=./certificates/ca-certificate.pem
mleaproxy.https.ca-private-key=./certificates/ca-privkey.pem
# Extra subjectAltName entries for a generated certificate (comma separated). The detected
# hostname, localhost, 127.0.0.1 and ::1 are always included.
# mleaproxy.https.subject-alt-names=marklogic.example.com,192.168.1.50

# Base URL advertised as authorization_endpoint in the discovery documents.
# Defaults to https://<hostname>:<mleaproxy.https.port>
# oauth.authorize.base.url=https://rocky.warnesnet.com:8443

# --- In-Memory Directory Server: marklogic ---
mleaproxy.directory-servers.marklogic.name=MarkLogic Local Directory
mleaproxy.directory-servers.marklogic.ip-address=0.0.0.0
mleaproxy.directory-servers.marklogic.port=60389
mleaproxy.directory-servers.marklogic.base-dn=dc=MarkLogic,dc=Local
mleaproxy.directory-servers.marklogic.admin-dn=cn=Directory Manager
mleaproxy.directory-servers.marklogic.admin-password=password

# --- LDAP Listener: proxy ---
mleaproxy.ldap-listeners.proxy.ip-address=0.0.0.0
mleaproxy.ldap-listeners.proxy.port=10389
mleaproxy.ldap-listeners.proxy.secure=false
mleaproxy.ldap-listeners.proxy.debug-level=INFO
mleaproxy.ldap-listeners.proxy.ldap-mode=internal
mleaproxy.ldap-listeners.proxy.ldap-sets=internal
mleaproxy.ldap-listeners.proxy.request-processor=jsonauth
mleaproxy.ldap-listeners.proxy.description=LDAP Authentication Proxy

# --- Server Set: internal ---
mleaproxy.ldap-sets.internal.servers=localhost
mleaproxy.ldap-sets.internal.secure=false

# --- Backend Server: localhost ---
mleaproxy.ldap-servers.localhost.host=localhost
mleaproxy.ldap-servers.localhost.port=60389

# --- Request Processor: jsonauth ---
mleaproxy.request-processors.jsonauth.auth-class=com.marklogic.processors.JsonRequestProcessor
mleaproxy.request-processors.jsonauth.debug-level=INFO

# --- Kerberos (disabled by default) ---
mleaproxy.kerberos.enabled=false
mleaproxy.kerberos.realm=MARKLOGIC.LOCAL
mleaproxy.kerberos.kdc-host=localhost
mleaproxy.kerberos.kdc-port=8088
mleaproxy.kerberos.admin-port=60749
mleaproxy.kerberos.work-dir=./kerberos
mleaproxy.kerberos.debug=false
