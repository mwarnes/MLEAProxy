<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>OAuth 2.0 Authorization Error</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fa fa-exclamation-triangle"></i>
                        OAuth 2.0 Authorization Error</h5>
                </div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-3">Error</dt>
                        <dd class="col-sm-9"><code th:text="${error}">invalid_request</code></dd>
                        <dt class="col-sm-3">Description</dt>
                        <dd class="col-sm-9" th:text="${errorDescription}">Description</dd>
                    </dl>
                    <p class="text-muted mb-0">
                        The authorization response could not be returned to the client, so this
                        page is shown instead of a redirect.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
